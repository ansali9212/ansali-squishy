<!DOCTYPE html>
<html>
<head>
<title>ANSALI SQUISHY</title>
<style>
body {background-color: lightblue;}
h1 {color: brown;}
button {background-color: green;}
  </style>
  </head>
  <body>
    <h1>ANSALI SQUISHY</h1>
    <h1>Hi, kami menjual berbagai mainan squishy dengan harga terjangkau.</h1>
<p><b>Cek mainan yang kamu cari disini</b></p>
 <h2>Variasi</h2>
<p>Squishy Size S - Rp5.000</p>
<p>Squishy Size M - Rp10.000</p>
<p>Squishy Size L - Rp12.000</p>
<p>Squishy Size XL - Rp15.000</p>
<button onclick="pesan()">PESAN SEKARANG</button>
<script>
  function pesan(){let nama = document.getElementById("nama").value; let ukuran = document.getElementById("ukuran"); let jumlah = document.getElementById("jumlah").value; let harga = ukuran.value; let namaUkuran = ukuran.options[ukuran.selectedIndex].text; let total = harga * jumlah; let pesan = `Halo, saya ingin pesan squishy.
  Nama: ${nama} 
  Ukuran: ${namaUkuran} 
  Jumlah: ${jumlah} 
  Total: Rp${total.toLocaleString("id-ID")}`;
  let nomor = "62895418961010";
  window.open("https://wa.me/" + nomor + "?text=" + encodeURIComponent(pesan),"_blank");}
</script>
<h2>Form Pemesanan</h2>
<label>Nama:</label>
<input type="text" id="nama" placeholder="Masukan nama kamu">
<br><br>
<label>Pilih ukuran:</label>
<select id="ukuran">
  <option value="5000">Size S - Rp5.000</option>
  <option value="10000">Size M - Rp10.000</option>
  <option value="12000">Size L - Rp12.000</option>
  <option value="15000">Size XL - Rp15.000</option>
</select>
<br><br>
<label>Jumlah</label>
<input type="number" id="jumlah" min="1">
<br><br>
<button onclick="hitung()">HITUNG TOTAL</button>
<p id="total"></p>
<script>
  function hitung() { let harga = document.getElementById("ukuran").value; let jumlah = document.getElementById("jumlah").value; let total = harga * jumlah ; document.getElementById("total").innerHTML = "Total Harga: Rp" + total.toLocaleString("id-ID");}
</script>
</body>
</html>
